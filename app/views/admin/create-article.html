    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('articleForm');
            const excerptField = document.getElementById('excerpt');
            const excerptHint = document.getElementById('excerpt-hint');

            // Mettre à jour le compteur de caractères
            if (excerptField) {
                excerptField.addEventListener('input', function() {
                    const count = this.value.length;
                    excerptHint.textContent = `${count} / 500 caractères`;
                });
            }

            // Validation du formulaire
            form.addEventListener('submit', function(e) {
                let hasErrors = false;

                // Réinitialiser les erreurs
                document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
                document.querySelectorAll('.form-input, .form-textarea').forEach(el => el.classList.remove('error'));

                // Valider le titre
                const title = document.getElementById('title');
                if (!title.value.trim()) {
                    showError(title, 'Le titre est requis');
                    hasErrors = true;
                } else if (title.value.length < 3) {
                    showError(title, 'Le titre doit faire au minimum 3 caractères');
                    hasErrors = true;
                }

                // Valider l'extrait
                const excerpt = document.getElementById('excerpt');
                if (!excerpt.value.trim()) {
                    showError(excerpt, "L'extrait est requis");
                    hasErrors = true;
                } else if (excerpt.value.length < 10) {
                    showError(excerpt, "L'extrait doit faire au minimum 10 caractères");
                    hasErrors = true;
                }

                // Valider le contenu
                const content = document.getElementById('content');
                if (!content.value.trim()) {
                    showError(content, 'Le contenu est requis');
                    hasErrors = true;
                } else if (content.value.length < 10) {
                    showError(content, 'Le contenu doit faire au minimum 10 caractères');
                    hasErrors = true;
                }

                if (hasErrors) {
                    e.preventDefault();
                    document.querySelector('.form-header').scrollIntoView({ behavior: 'smooth' });
                }
            });

            function showError(field, message) {
                field.classList.add('error');
                const errorElement = document.getElementById(field.id + '-error');
                if (errorElement) {
                    errorElement.textContent = message;
                }
            }
        });
    </script>
